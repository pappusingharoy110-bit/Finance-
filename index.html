<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Own Finance</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#101B2E] text-[#F5F1E3] font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { useState } = React;

    const UI_TEXT = {
      en: {
        appTitle: "Own Finance",
        tagline: "Financial Literacy & Wealth Ledger",
        lessonsTab: "Lessons",
        videosTab: "Video Section",
        quizTab: "Practice & Quiz",
        assistantTab: "Pappu AI",
        selectTopic: "Select a Topic",
        selectLevel: "Select Level",
        keyTakeaways: "Key Takeaways",
        realExample: "Practical Example",
        askPappu: "Ask Pappu AI",
        askPlaceholder: "Ask a finance question...",
        send: "Send",
        switchLang: "বাংলা",
      },
      bn: {
        appTitle: "Own Finance",
        tagline: "আর্থিক সাক্ষরতা ও সম্পদ ব্যবস্থাপনা শিক্ষালয়",
        lessonsTab: "পাঠসমূহ",
        videosTab: "ভিডিও সেশন",
        quizTab: "অনুশীলনী ও কুইজ",
        assistantTab: "পাপ্পু এআই",
        selectTopic: "বিষয় নির্বাচন করুন",
        selectLevel: "লেভেল নির্বাচন করুন",
        keyTakeaways: "মূল বিষয়বস্তু",
        realExample: "বাস্তব উদাহরণ",
        askPappu: "পাপ্পু এআই-কে জিজ্ঞাসা করুন",
        askPlaceholder: "আর্থিক প্রশ্ন লিখুন...",
        send: "পাঠান",
        switchLang: "English",
      }
    };

    const LEVEL_META = {
      basic: { labelEn: "Basic", labelBn: "প্রাথমিক" },
      intermediate: { labelEn: "Intermediate", labelBn: "মধ্যবর্তী" },
      advanced: { labelEn: "Advanced", labelBn: "উচ্চতর" },
    };

    const TOPICS = [
      {
        id: "basic-1", level: "basic", num: 1, youtubeId: "3Ma38uI9O2s",
        titleEn: "What Is Money, and Why Does It Have Value",
        titleBn: "অর্থ কী এবং এর মূল্যায়ন কীভাবে হয়?",
        introEn: "Money works because a large group of people agree to trust it as a medium of exchange.",
        introBn: "অর্থ তখনই কাজ করে যখন মানুষ এটিকে বিনিময়ের মাধ্যম হিসেবে বিশ্বাস করে।",
        keyPointsEn: ["Medium of exchange", "Fiat currency backing", "Trust in government issuing"],
        keyPointsBn: ["লেনদেনের মাধ্যম", "সরকারি অনুমোদন (ফিয়াট মানি)", "ইস্যুকারী প্রতিষ্ঠানের প্রতি আস্থা"],
        exampleEn: "A ₹500 note is paper, but accepted because the Central Bank backs it.",
        exampleBn: "পাঁচশত টাকার নোট একখণ্ড কাগজ হলেও কেন্দ্রীয় ব্যাংকের গ্যারান্টিতে সবাই গ্রহণ করে।",
        problems: [{
          qEn: "Why does fiat currency have value?",
          qBn: "ফিয়াট কারেন্সির মূল্যের ভিত্তি কী?",
          optionsEn: ["Made of gold", "Government backing & trust", "Convertible to silver", "No value"],
          optionsBn: ["স্বর্ণ দিয়ে তৈরি", "সরকারি নিশ্চয়তা ও জনগণের আস্থা", "রুপার সমান মান", "কোনো মূল্য নেই"],
          correct: 1,
          explanationEn: "Fiat money gets value from trust and law.",
          explanationBn: "ফিয়াট মানির মূল্য আসে আইনি স্বীকৃতি ও জনআস্থা থেকে।"
        }]
      },
      {
        id: "basic-2", level: "basic", num: 2, youtubeId: "HQzoZfc3GwQ",
        titleEn: "Income, Expenses, and Household Budgeting",
        titleBn: "আয়, ব্যয় এবং পারিবারিক বাজেট পরিকল্পনা",
        introEn: "A budget compares income against expenses to build long-term savings.",
        introBn: "আয়ের সাথে ব্যয়ের সঠিক অনুপাত বজায় রাখাই বাজেট ব্যবস্থাপনার প্রথম ধাপ।",
        keyPointsEn: ["Track fixed vs variable costs", "50/30/20 Budgeting Rule"],
        keyPointsBn: ["নির্দিষ্ট ও আনুষঙ্গিক খরচ পৃথকীকরণ", "৫০/৩০/২০ বাজেটিং নিয়ম"],
        exampleEn: "Save 20% of income directly into savings before spending on wants.",
        exampleBn: "আয়ের ২০% শুরুতেই সঞ্চয় ফান্ডে জমা রেখে বাকি টাকা ব্যয় করুন।",
        problems: [{
          qEn: "Under 50/30/20 rule, what share goes to savings?",
          qBn: "৫০/৩০/২০ নীতিতে সঞ্চয়ের ভাগ কত?",
          optionsEn: ["50%", "30%", "20%", "10%"],
          optionsBn: ["৫০%", "৩০%", "২০%", "১০%"],
          correct: 2,
          explanationEn: "20% is recommended for savings.",
          explanationBn: "২০% অর্থ সঞ্চয় করা উচিত।"
        }]
      }
    ];

    function App() {
      const [lang, setLang] = useState("bn");
      const [activeTab, setActiveTab] = useState("lessons");
      const [selectedLevel, setSelectedLevel] = useState("basic");
      const [selectedTopicId, setSelectedTopicId] = useState("basic-1");
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [chatMessages, setChatMessages] = useState([
        { sender: "bot", textBn: "হ্যালো! আমি পাপ্পু এআই। অর্থ বা বাজেট নিয়ে যেকোনো প্রশ্ন করতে পারেন।", textEn: "Hello! I am Pappu AI. Ask me any finance or budgeting question." }
      ]);
      const [inputQuery, setInputQuery] = useState("");

      const t = UI_TEXT[lang];
      const levelTopics = TOPICS.filter((tp) => tp.level === selectedLevel);
      const activeTopic = TOPICS.find((tp) => tp.id === selectedTopicId) || TOPICS[0];

      const handleSend = () => {
        if (!inputQuery.trim()) return;
        const userText = inputQuery;
        setChatMessages((prev) => [...prev, { sender: "user", textBn: userText, textEn: userText }]);
        setInputQuery("");

        setTimeout(() => {
          setChatMessages((prev) => [
            ...prev,
            {
              sender: "bot",
              textBn: "আপনার প্রশ্নের জন্য ধন্যবাদ! নিয়মিত সঞ্চয় করুন এবং ৫০/৩০/২০ বাজেটিং নিয়ম অনুসরণ করুন।",
              textEn: "Thank you for asking! Remember to save regularly and follow the 50/30/20 budgeting rule."
            }
          ]);
        }, 600);
      };

      return e("div", { className: "min-h-screen bg-[#101B2E] text-[#F5F1E3] flex flex-col justify-between" },
        e("div", null,
          // HEADER
          e("header", { className: "border-b border-[#B98D3E]/30 bg-[#101B2E] sticky top-0 z-50 px-4 py-3 shadow-md" },
            e("div", { className: "max-w-6xl mx-auto flex justify-between items-center" },
              e("div", { className: "flex items-center gap-3" },
                e("div", { className: "bg-[#B98D3E] text-[#101B2E] px-3 py-1 rounded font-bold text-xl" }, "OF"),
                e("div", null,
                  e("h1", { className: "text-xl font-bold text-[#D9AE63]" }, t.appTitle),
                  e("p", { className: "text-xs text-[#DCD0A6]/70 hidden sm:block" }, t.tagline)
                )
              ),
              e("button", {
                onClick: () => setLang(lang === "en" ? "bn" : "en"),
                className: "px-3 py-1.5 rounded-full border border-[#B98D3E] text-[#D9AE63] hover:bg-[#B98D3E]/10 text-sm font-semibold"
              }, t.switchLang)
            )
          ),
          // MAIN CONTENT
          e("main", { className: "max-w-6xl mx-auto p-4 sm:p-6 grid grid-cols-1 md:grid-cols-12 gap-6 w-full flex-grow" },
            // SIDEBAR
            e("aside", { className: "md:col-span-4 bg-[#1B2A44] border border-[#2A3B5C] rounded-xl p-4 h-fit" },
              e("div", { className: "mb-4" },
                e("div", { className: "text-xs uppercase text-[#B98D3E] font-semibold mb-2" }, t.selectLevel),
                e("div", { className: "grid grid-cols-3 gap-1 bg-[#101B2E] p-1 rounded-lg border border-[#2A3B5C]" },
                  Object.keys(LEVEL_META).map((lvlKey) =>
                    e("button", {
                      key: lvlKey,
                      onClick: () => {
                        setSelectedLevel(lvlKey);
                        const first = TOPICS.find((t) => t.level === lvlKey);
                        if (first) setSelectedTopicId(first.id);
                      },
                      className: `py-1.5 px-2 rounded text-xs font-semibold ${selectedLevel === lvlKey ? "bg-[#B98D3E] text-[#101B2E]" : "text-[#DCD0A6]/70"}`
                    }, lang === "en" ? LEVEL_META[lvlKey].labelEn : LEVEL_META[lvlKey].labelBn)
                  )
                )
              ),
              e("div", { className: "text-xs uppercase text-[#B98D3E] font-semibold mb-2" }, t.selectTopic),
              e("div", { className: "space-y-2" },
                levelTopics.map((tp) =>
                  e("button", {
                    key: tp.id,
                    onClick: () => setSelectedTopicId(tp.id),
                    className: `w-full text-left p-3 rounded-lg border text-sm transition-all ${tp.id === selectedTopicId ? "bg-[#2F5D50]/40 border-[#3F7A69] text-white" : "bg-[#101B2E]/50 border-[#2A3B5C] text-[#DCD0A6]"}`
                  }, `${tp.num}. ${lang === "en" ? tp.titleEn : tp.titleBn}`)
                )
              )
            ),
            // SECTION TABS
            e("section", { className: "md:col-span-8 flex flex-col gap-4" },
              e("div", { className: "flex border-b border-[#2A3B5C] bg-[#1B2A44] rounded-t-xl px-2 pt-2 gap-1 overflow-x-auto" },
                ["lessons", "videos", "quiz", "assistant"].map((tab) =>
                  e("button", {
                    key: tab,
                    onClick: () => setActiveTab(tab),
                    className: `px-4 py-2.5 text-sm font-semibold border-b-2 whitespace-nowrap ${activeTab === tab ? "border-[#B98D3E] text-[#D9AE63]" : "border-transparent text-[#DCD0A6]/70"}`
                  }, t[`${tab}Tab`])
                )
              ),

              // TAB 1: LESSONS
              activeTab === "lessons" && e("div", { className: "bg-[#F5F1E3] text-[#101B2E] rounded-b-xl p-6 shadow-md" },
                e("h2", { className: "text-2xl font-bold mb-4" }, lang === "en" ? activeTopic.titleEn : activeTopic.titleBn),
                e("p", { className: "text-base mb-6" }, lang === "en" ? activeTopic.introEn : activeTopic.introBn),
                e("div", { className: "bg-[#ECE4C9] border-l-4 border-[#B98D3E] p-4 rounded-r mb-6" },
                  e("h3", { className: "font-bold text-sm uppercase text-[#7A2A2E] mb-2" }, t.keyTakeaways),
                  e("ul", { className: "space-y-1 text-sm" },
                    (lang === "en" ? activeTopic.keyPointsEn : activeTopic.keyPointsBn).map((pt, i) => e("li", { key: i }, `• ${pt}`))
                  )
                ),
                e("div", { className: "bg-[#101B2E] text-[#F5F1E3] p-4 rounded-lg" },
                  e("h4", { className: "text-xs font-mono text-[#D9AE63] mb-1" }, t.realExample),
                  e("p", { className: "text-sm italic" }, `"${lang === "en" ? activeTopic.exampleEn : activeTopic.exampleBn}"`)
                )
              ),

              // TAB 2: VIDEO SECTION
              activeTab === "videos" && e("div", { className: "bg-[#1B2A44] border border-[#2A3B5C] rounded-b-xl p-6" },
                e("h3", { className: "text-xl font-bold text-[#D9AE63] mb-4" }, lang === "en" ? activeTopic.titleEn : activeTopic.titleBn),
                e("div", { className: "relative w-full aspect-video rounded-xl overflow-hidden bg-black border border-[#2A3B5C]" },
                  e("iframe", {
                    className: "w-full h-full",
                    src: `https://www.youtube-nocookie.com/embed/${activeTopic.youtubeId}`,
                    title: "Video Lesson",
                    allowFullScreen: true
                  })
                )
              ),

              // TAB 3: PRACTICE & QUIZ
              activeTab === "quiz" && e("div", { className: "bg-[#1B2A44] border border-[#2A3B5C] rounded-b-xl p-6 space-y-4" },
                activeTopic.problems.map((prob, pIdx) => {
                  const selectedOpt = selectedAnswers[activeTopic.id];
                  const isAnswered = selectedOpt !== undefined;
                  return e("div", { key: pIdx, className: "bg-[#101B2E] p-5 rounded-xl border border-[#2A3B5C] space-y-4" },
                    e("p", { className: "font-semibold text-lg" }, `${pIdx + 1}. ${lang === "en" ? prob.qEn : prob.qBn}`),
                    e("div", { className: "grid grid-cols-1 sm:grid-cols-2 gap-3" },
                      (lang === "en" ? prob.optionsEn : prob.optionsBn).map((opt, optIdx) =>
                        e("button", {
                          key: optIdx,
                          disabled: isAnswered,
                          onClick: () => setSelectedAnswers({ ...selectedAnswers, [activeTopic.id]: optIdx }),
                          className: `p-3 text-left rounded-lg border text-sm transition-all ${
                            isAnswered
                              ? optIdx === prob.correct
                                ? "bg-emerald-950 border-emerald-500 text-emerald-200"
                                : selectedOpt === optIdx
                                ? "bg-rose-950 border-rose-500 text-rose-200"
                                : "opacity-40 border-[#2A3B5C]"
                              : "bg-[#1B2A44] border-[#2A3B5C] hover:border-[#B98D3E]"
                          }`
                        }, opt)
                      )
                    ),
                    isAnswered && e("div", { className: "p-4 rounded-lg border text-sm bg-slate-900 border-slate-700 mt-2 text-[#DCD0A6]" },
                      e("p", null, lang === "en" ? prob.explanationEn : prob.explanationBn)
                    )
                  );
                })
              ),

              // TAB 4: PAPPU AI
              activeTab === "assistant" && e("div", { className: "bg-[#1B2A44] border border-[#2A3B5C] rounded-b-xl p-6 space-y-4 flex flex-col h-[450px] justify-between" },
                e("div", { className: "border-b border-[#2A3B5C] pb-3" },
                  e("h3", { className: "text-lg font-bold text-[#D9AE63]" }, t.askPappu)
                ),
                e("div", { className: "overflow-y-auto space-y-3 flex-grow pr-1" },
                  chatMessages.map((msg, idx) =>
                    e("div", {
                      key: idx,
                      className: `max-w-[85%] p-3 rounded-lg text-sm ${
                        msg.sender === "user"
                          ? "ml-auto bg-[#B98D3E] text-[#101B2E] font-medium"
                          : "bg-[#101B2E] text-[#F5F1E3] border border-[#2A3B5C]"
                      }`
                    }, lang === "en" ? msg.textEn : msg.textBn)
                  )
                ),
                e("div", { className: "flex gap-2 pt-2 border-t border-[#2A3B5C]" },
                  e("input", {
                    type: "text",
                    value: inputQuery,
                    onChange: (evt) => setInputQuery(evt.target.value),
                    onKeyDown: (evt) => evt.key === "Enter" && handleSend(),
                    placeholder: t.askPlaceholder,
                    className: "flex-grow bg-[#101B2E] border border-[#2A3B5C] rounded-lg px-3 py-2 text-sm text-[#F5F1E3] focus:outline-none focus:border-[#B98D3E]"
                  }),
                  e("button", {
                    onClick: handleSend,
                    className: "bg-[#B98D3E] text-[#101B2E] font-semibold px-4 py-2 rounded-lg text-sm hover:bg-[#D9AE63]"
                  }, t.send)
                )
              )
            )
          )
        ),
        // FOOTER
        e("footer", { className: "border-t border-[#2A3B5C]/60 bg-[#0B1321] py-6 text-center mt-12" },
          e("p", { className: "text-sm font-semibold text-[#D9AE63]" }, "Made by Pappu Singha Roy"),
          e("p", { className: "text-xs text-[#DCD0A6]/60 mt-1" }, "The part of edu-art-group")
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(e(App));
  </script>
</body>
  </html>
