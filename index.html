<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Own Finance Master</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0B132B]">

  <!-- REQUIRED: HTML Root Element -->
  <div id="root"></div>

  <!-- REQUIRED: Babel Script Type -->
  <script type="text/babel">
    // REQUIRED FOR CDN REACT: Extract React Hooks
    const { useState, useEffect, useMemo, useRef } = React;

    // Sample Topics Data (Prevents runtime crash)
    const TOPICS = [
      {
        id: 1,
        level: 'Basic',
        title: 'Introduction to Money & Finance',
        intro: 'Money is any item or verifiable record that is generally accepted as payment for goods and services.',
        takeaways: ['Medium of exchange', 'Unit of account', 'Store of value'],
        example: 'Using cash or a debit card to purchase groceries.',
        videoUrl: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
        questions: [
          {
            question: 'What is a primary function of money?',
            options: ['Medium of Exchange', 'Physical Weight', 'Color Variance'],
            answer: 0
          }
        ]
      }
    ];

    function App() {
      const [selectedLevel, setSelectedLevel] = useState('Basic');
      const [selectedTopicId, setSelectedTopicId] = useState(1);
      const [activeTab, setActiveTab] = useState('lessons');
      const [searchTerm, setSearchTerm] = useState('');
      const [theaterMode, setTheaterMode] = useState(false);
      const [watchedVideos, setWatchedVideos] = useState([]);
      const [selectedAnswers, setSelectedAnswers] = useState({});
      const [chatMessages, setChatMessages] = useState([
        { sender: "bot", text: "Welcome to Own Finance Master! Ask me anything." }
      ]);
      const [inputQuery, setInputQuery] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const chatEndRef = useRef(null);

      // Search & Filter Logic
      const filteredTopics = useMemo(() => {
        if (!searchTerm.trim()) {
          return TOPICS.filter((tp) => tp.level === selectedLevel);
        }
        const term = searchTerm.toLowerCase();
        return TOPICS.filter((tp) =>
          tp.title.toLowerCase().includes(term) ||
          tp.intro.toLowerCase().includes(term)
        );
      }, [selectedLevel, searchTerm]);

      const activeTopic = TOPICS.find((tp) => tp.id === selectedTopicId) || TOPICS[0];

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [chatMessages, isTyping]);

      const handleSendMessage = () => {
        if (!inputQuery.trim()) return;
        const userMsg = inputQuery.trim();
        setChatMessages((prev) => [...prev, { sender: 'user', text: userMsg }]);
        setInputQuery('');
        setIsTyping(true);

        setTimeout(() => {
          setChatMessages((prev) => [
            ...prev, 
            { sender: 'bot', text: 'Financial management is key to long-term wealth building!' }
          ]);
          setIsTyping(false);
        }, 600);
      };

      const toggleVideoWatched = (id) => {
        setWatchedVideos((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const handleSelectAnswer = (qIdx, optionIdx) => {
        setSelectedAnswers((prev) => ({ ...prev, [qIdx]: optionIdx }));
      };

      return (
        <div className={`min-h-screen ${theaterMode ? 'bg-black text-white' : 'bg-[#0B132B] text-slate-100'} font-sans pb-10 transition-colors duration-300`}>
          <header className="flex items-center justify-between px-4 py-3 bg-[#1C2541] border-b border-slate-800 sticky top-0 z-50 shadow-md">
            <div className="flex items-center space-x-3">
              <div className="bg-[#E0A96D] text-[#0B132B] font-bold text-lg px-3 py-1 rounded">OF</div>
              <h1 className="text-xl font-bold tracking-wide text-white">
                OWN FINANCE <span className="text-xs text-emerald-400 font-mono ml-2">v2.0 MASTER</span>
              </h1>
            </div>
            <button className="px-4 py-1.5 rounded-full border border-[#E0A96D] text-[#E0A96D] text-sm font-medium hover:bg-[#E0A96D] hover:text-[#0B132B] transition">
              বাংলা
            </button>
          </header>

          <main className="max-w-4xl mx-auto p-4 space-y-6">
            <div className="bg-[#1C2541] p-4 rounded-xl border border-slate-800 shadow-lg space-y-4">
              <div>
                <label className="text-xs font-semibold text-[#E0A96D] uppercase tracking-wider block mb-2">
                  Select Level
                </label>
                <div className="grid grid-cols-3 gap-2 bg-[#0B132B] p-1 rounded-lg">
                  {['Basic', 'Intermediate', 'Advanced'].map((lvl) => (
                    <button
                      key={lvl}
                      onClick={() => {
                        setSelectedLevel(lvl);
                        setSelectedTopicId(1);
                      }}
                      className={`py-2 text-sm font-medium rounded-md transition ${
                        selectedLevel === lvl
                          ? 'bg-[#E0A96D] text-[#0B132B] font-bold shadow'
                          : 'text-slate-400 hover:text-white'
                      }`}
                    >
                      {lvl}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="text-xs font-semibold text-[#E0A96D] uppercase tracking-wider block mb-2">
                  Select a Topic
                </label>
                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                  {filteredTopics.map((tp) => (
                    <button
                      key={tp.id}
                      onClick={() => setSelectedTopicId(tp.id)}
                      className={`w-full text-left p-3 rounded-lg border transition ${
                        selectedTopicId === tp.id
                          ? 'bg-[#1C3144] border-[#E0A96D] text-white font-medium'
                          : 'bg-[#0B132B] border-slate-800 text-slate-300 hover:bg-[#121A2D]'
                      }`}
                    >
                      {tp.id}. {tp.title}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            <div className="flex border-b border-slate-800 bg-[#1C2541] rounded-t-xl overflow-x-auto">
              {[
                { id: 'lessons', label: 'Lessons' },
                { id: 'videos', label: 'Video Section' },
                { id: 'quiz', label: 'Practice & Quiz' },
                { id: 'ai', label: 'Pappu AI' }
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex-1 py-3 px-4 text-center font-semibold text-sm whitespace-nowrap border-b-2 transition ${
                    activeTab === tab.id
                      ? 'border-[#E0A96D] text-[#E0A96D] bg-[#0B132B]/40'
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            <div className="bg-[#1C2541] p-5 rounded-b-xl border border-t-0 border-slate-800 min-h-[360px]">
              {activeTab === 'lessons' && activeTopic && (
                <div className="space-y-6 text-slate-900 bg-[#FAF7F2] p-6 rounded-xl shadow-md">
                  <h2 className="text-2xl font-bold text-[#0B132B] border-b pb-2">{activeTopic.title}</h2>
                  <p className="text-base leading-relaxed text-slate-700">{activeTopic.intro}</p>
                </div>
              )}

              {activeTab === 'ai' && (
                <div className="space-y-4">
                  <h2 className="text-lg font-bold text-white border-b border-slate-800 pb-2">Ask Pappu AI</h2>
                  <div className="h-80 overflow-y-auto space-y-3 p-3 bg-[#0B132B] rounded-xl border border-slate-800">
                    {chatMessages.map((msg, index) => (
                      <div key={index} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[85%] p-3 rounded-2xl text-sm ${
                          msg.sender === 'user' ? 'bg-[#2563EB] text-white' : 'bg-[#1C2541] text-slate-200'
                        }`}>
                          {msg.text}
                        </div>
                      </div>
                    ))}
                    <div ref={chatEndRef} />
                  </div>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={inputQuery}
                      onChange={(e) => setInputQuery(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                      placeholder="Ask a question..."
                      className="flex-1 bg-[#0B132B] border border-slate-700 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none"
                    />
                    <button
                      onClick={handleSendMessage}
                      className="bg-[#10B981] hover:bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-lg text-sm transition"
                    >
                      SEND
                    </button>
                  </div>
                </div>
              )}
            </div>
          </main>

          <footer className="text-center mt-10 text-xs text-slate-500 space-y-1">
            <p>Developed by <span className="text-emerald-400 font-semibold">Pappu Singha Roy</span></p>
            <p className="text-[10px] uppercase tracking-wider text-slate-600">An Education & Art Store Initiative</p>
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
